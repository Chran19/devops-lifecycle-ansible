# ==============================================================================
# Kubernetes Service Manifest
# Activity: CNAD Activity 01 - Docker & Kubernetes Deployment
# Object: Service (Provides stable internal IP and exposes application to host)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: cnad-web-service
  labels:
    app: cnad-web-app
    activity: cnad-01
spec:
  # NodePort exposes service on each node's IP at a static port (30000-32767)
  # Change to LoadBalancer if deploying to cloud managed K8s (EKS/GKE/AKS)
  type: NodePort
  selector:
    app: cnad-web-app
  ports:
    - name: http
      protocol: TCP
      port: 80           # Cluster-internal virtual port
      targetPort: 5000   # Container application port
      nodePort: 30080    # External host access port (http://localhost:30080)
