# ==============================================================================
# All-In-One Kubernetes Manifest: Deployment + Service
# Activity: CNAD Activity 01 - Docker & Kubernetes Deployment
# Usage: kubectl apply -f k8s/k8s-combined.yaml
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnad-web-deployment
  labels:
    app: cnad-web-app
    tier: frontend
    activity: cnad-01
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cnad-web-app
  template:
    metadata:
      labels:
        app: cnad-web-app
        tier: frontend
    spec:
      containers:
        - name: cnad-web-container
          image: cnad-web-app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-port
              containerPort: 5000
              protocol: TCP
          env:
            - name: APP_NAME
              value: "CNAD Cloud-Native Portal (Kubernetes)"
            - name: APP_ENV
              value: "production"
            - name: APP_VERSION
              value: "v1.0.0"
            - name: PORT
              value: "5000"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: cnad-web-service
  labels:
    app: cnad-web-app
    activity: cnad-01
spec:
  type: NodePort
  selector:
    app: cnad-web-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30080
