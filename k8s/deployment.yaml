# ==============================================================================
# Kubernetes Deployment Manifest
# Activity: CNAD Activity 01 - Docker & Kubernetes Deployment
# Object: Deployment (Manages ReplicaSets and Pod lifecycle)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnad-web-deployment
  labels:
    app: cnad-web-app
    tier: frontend
    activity: cnad-01
spec:
  # Maintain 3 replicas for high availability and load-balancing demonstration
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cnad-web-app
  template:
    metadata:
      labels:
        app: cnad-web-app
        tier: frontend
    spec:
      containers:
        - name: cnad-web-container
          image: cnad-web-app:v1.0.0
          # Use local Docker image without pulling from remote registry
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-port
              containerPort: 5000
              protocol: TCP
          env:
            - name: APP_NAME
              value: "CNAD Cloud-Native Portal (Kubernetes)"
            - name: APP_ENV
              value: "production"
            - name: APP_VERSION
              value: "v1.0.0"
            - name: PORT
              value: "5000"
            # Kubernetes Downward API: Pass Pod metadata directly into container
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Resource Governance: Requests (guaranteed) & Limits (maximum ceiling)
          resources:
            requests:
              cpu: "100m"      # 0.1 CPU core
              memory: "128Mi"  # 128 Megabytes RAM
            limits:
              cpu: "250m"      # 0.25 CPU core
              memory: "256Mi"  # 256 Megabytes RAM
          # Liveness Probe: Kubelet restarts container if probe fails
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness Probe: Container only receives traffic when probe passes
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
